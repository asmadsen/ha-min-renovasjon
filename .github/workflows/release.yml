name: "Release"

on:
  release:
    types:
      - "published"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the ZIP to"
        required: true
        type: "string"

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v5"

      - name: "Resolve release tag"
        id: "release"
        shell: "bash"
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: "Adjust version number"
        shell: "bash"
        run: |
          yq -i -o json '.version="${{ steps.release.outputs.tag }}"' \
            "${{ github.workspace }}/custom_components/min_renovasjon/manifest.json"

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          cd "${{ github.workspace }}/custom_components/min_renovasjon"
          zip min_renovasjon.zip -r ./

      - name: "Upload the ZIP file to the release"
        uses: softprops/action-gh-release@v2.4.1
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: ${{ github.workspace }}/custom_components/min_renovasjon/min_renovasjon.zip
